[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "nexus-server"
version = "0.1.0"
description = "Provider-agnostic agent runtime and API for NEXUS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.9,<1",
  "pypdf>=4,<6",
  "python-docx>=1,<2",
  "redis>=6,<8",
  "sqlalchemy[asyncio]>=2.0.41,<3",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]
rag = [
  "sentence-transformers>=3,<4",
  "numpy>=2,<3",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.agent.prompts" = ["*.txt"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["redis.*", "pypdf.*", "PyPDF2.*", "docx.*", "sentence_transformers.*"]
ignore_missing_imports = true
